services:
  web:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    expose:
      - "80"
    volumes:
      - ro_storage:/var/www/html/storage
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ro_storage:

networks:
  dokploy-network:
    external: true
