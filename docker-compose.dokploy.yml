services:
  web:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      QUEUE_CONNECTION: database
    expose:
      - "80"
    volumes:
      - ro_storage:/var/www/html/storage
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      QUEUE_CONNECTION: database
    # Shares web storage so the job can read locally staged FP documents.
    volumes:
      - ro_storage:/var/www/html/storage
    networks:
      - dokploy-network
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--tries=5", "--timeout=180", "--sleep=3"]

volumes:
  ro_storage:

networks:
  dokploy-network:
    external: true
