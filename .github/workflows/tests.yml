name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        # Validate the approved runtime used by both Docker PHP stages.
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, intl, bcmath, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Verify immutable integration and current lockfile consistency
        run: php tests/Support/verify-baseline.php

      - name: Prove isolation before database-writing tests
        run: vendor/bin/phpunit --filter IsolationTest --do-not-cache-result

      - name: Execute tests
        run: vendor/bin/phpunit --do-not-cache-result
